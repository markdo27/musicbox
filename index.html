<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MusicBox — MIDI Sequencer</title>
  <meta name="description" content="Browser-native MIDI step sequencer for Behringer synths. Create techno, tech house and acid sequences with genre presets." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ─── HEADER ─────────────────────────────────────────── -->
  <header class="app-header">
    <div class="logo">
      <span class="logo-icon">⬡</span>
      <span class="logo-text">MUSIC<strong>BOX</strong></span>
      <span class="logo-version">v1.0</span>
    </div>

    <div class="transport">
      <button class="btn-transport" id="btn-rewind" title="Rewind">⏮</button>
      <button class="btn-transport btn-play" id="btn-play" title="Play">▶</button>
      <button class="btn-transport btn-stop" id="btn-stop" title="Stop">■</button>
      <button class="btn-transport btn-record" id="btn-record" title="Record">●</button>

      <div class="bpm-block">
        <label>BPM</label>
        <input type="number" id="bpm-value" value="132" min="40" max="240" />
        <div class="bpm-arrows">
          <button id="bpm-up">▲</button>
          <button id="bpm-down">▼</button>
        </div>
        <button class="tap-btn" id="btn-tap">TAP</button>
      </div>

      <div class="swing-block">
        <label>SWING</label>
        <input type="range" id="swing-slider" min="0" max="100" value="0" />
        <span id="swing-value">0%</span>
      </div>

      <div class="step-count-block">
        <label>STEPS</label>
        <select id="step-count">
          <option value="16" selected>16</option>
          <option value="32">32</option>
        </select>
      </div>

      <!-- Audio Controls -->
      <div class="audio-controls-block">
        <button class="audio-toggle active" id="btn-audio-toggle" title="Toggle internal audio">
          <span class="audio-toggle-icon">🔊</span>
          <span class="audio-toggle-label">AUDIO</span>
        </button>
        <div class="master-vol-block">
          <label>VOL</label>
          <input type="range" id="master-vol" min="0" max="100" value="72" />
        </div>
      </div>
    </div>

    <div class="header-right">
      <div class="midi-status" id="midi-status">
        <span class="midi-dot" id="midi-dot"></span>
        <span id="midi-status-text">No MIDI</span>
      </div>
      <button class="icon-btn" id="btn-save" title="Save Project">💾</button>
      <button class="icon-btn" id="btn-load" title="Load Project">📂</button>
      <button class="icon-btn" id="btn-export-midi" title="Export MIDI">⬇ .mid</button>
      <input type="file" id="file-load-input" accept=".json" style="display:none" />
    </div>
  </header>

  <!-- ─── MAIN CONTENT ──────────────────────────────────── -->
  <main class="app-main">

    <!-- LEFT SIDEBAR: MIDI Devices + Presets -->
    <aside class="sidebar-left">
      <!-- MIDI Devices Panel -->
      <section class="panel" id="panel-midi">
        <h2 class="panel-title">
          <span class="panel-icon">📡</span> MIDI DEVICES
        </h2>
        <div class="device-list" id="device-list">
          <p class="no-devices" id="no-devices-msg">Connect a MIDI device...</p>
        </div>
        <button class="btn-secondary" id="btn-request-midi">Connect MIDI</button>
        <div class="midi-monitor" id="midi-monitor">
          <div class="monitor-header">
            <span>MIDI Monitor</span>
            <button class="btn-tiny" id="btn-clear-monitor">CLR</button>
          </div>
          <div class="monitor-log" id="monitor-log"></div>
        </div>
      </section>

      <!-- Genre Presets Panel -->
      <section class="panel" id="panel-presets">
        <h2 class="panel-title">
          <span class="panel-icon">🎨</span> GENRE PRESETS
        </h2>
        <div class="preset-grid" id="preset-grid">
          <!-- populated by JS -->
        </div>
        <div class="preset-controls">
          <button class="btn-secondary" id="btn-randomize">🎲 Randomize</button>
          <button class="btn-secondary" id="btn-clear-all">🗑 Clear All</button>
        </div>
      </section>
    </aside>

    <!-- CENTER: Sequencer Grid -->
    <section class="sequencer-area">
      <div class="sequencer-header">
        <h2 class="panel-title"><span class="panel-icon">🥁</span> SEQUENCER</h2>
        <div class="step-indicator-row" id="step-indicator-row">
          <!-- step number indicators, populated by JS -->
        </div>
      </div>
      <div class="track-list" id="track-list">
        <!-- 8 tracks populated by JS -->
      </div>
    </section>

    <!-- RIGHT SIDEBAR: Mixer + Note Editor -->
    <aside class="sidebar-right">
      <!-- Mixer -->
      <section class="panel" id="panel-mixer">
        <h2 class="panel-title"><span class="panel-icon">🎚️</span> MIXER</h2>
        <div class="mixer-tracks" id="mixer-tracks">
          <!-- populated by JS -->
        </div>
      </section>

      <!-- Spatial FX Controls -->
      <section class="panel" id="panel-spatial-fx">
        <h2 class="panel-title"><span class="panel-icon">🌌</span> SPATIAL FX</h2>
        <div class="spatial-fx-controls">
          <div class="fx-row">
            <span class="fx-label">Reverb Mix</span>
            <input type="range" class="fx-slider" id="fx-reverb-mix" min="0" max="100" value="25" />
            <span class="fx-val" id="fx-reverb-mix-val">25%</span>
          </div>
          <div class="fx-row">
            <span class="fx-label">Reverb Space</span>
            <input type="range" class="fx-slider" id="fx-reverb-decay" min="10" max="80" value="25" />
            <span class="fx-val" id="fx-reverb-decay-val">2.5s</span>
          </div>
          <div class="fx-row">
            <span class="fx-label">Delay Mix</span>
            <input type="range" class="fx-slider" id="fx-delay-mix" min="0" max="100" value="20" />
            <span class="fx-val" id="fx-delay-mix-val">20%</span>
          </div>
          <div class="fx-row">
            <span class="fx-label">Delay Time</span>
            <select class="fx-select" id="fx-delay-time">
              <option value="0.12">1/16 Note</option>
              <option value="0.24">1/8 Note</option>
              <option value="0.36" selected>1/8 Dotted</option>
              <option value="0.48">1/4 Note</option>
              <option value="0.72">1/4 Dotted</option>
            </select>
          </div>
          <div class="fx-row">
            <span class="fx-label">Delay Feedback</span>
            <input type="range" class="fx-slider" id="fx-delay-feedback" min="0" max="95" value="45" />
            <span class="fx-val" id="fx-delay-feedback-val">45%</span>
          </div>
        </div>
      </section>

      <!-- Step Editor (context panel) -->
      <section class="panel" id="panel-step-editor">
        <h2 class="panel-title"><span class="panel-icon">✏️</span> STEP EDITOR</h2>
        <div class="step-editor-content" id="step-editor-content">
          <p class="hint-text">Click a step to edit</p>
        </div>
      </section>

      <!-- Instrument Types -->
      <section class="panel" id="panel-instruments">
        <h2 class="panel-title"><span class="panel-icon">🎛️</span> INSTRUMENTS</h2>
        <div class="instrument-list" id="instrument-list">
          <!-- populated by JS -->
        </div>
      </section>

      <!-- Keyboard Visualizer -->
      <section class="panel" id="panel-keyboard">
        <h2 class="panel-title"><span class="panel-icon">🎹</span> KEYBOARD</h2>
        <div class="keyboard-wrap" id="keyboard-wrap">
          <!-- piano keys populated by JS -->
        </div>
      </section>
    </aside>
  </main>

  <!-- ─── MODALS ─────────────────────────────────────────── -->

  <!-- Note Picker Modal -->
  <div class="modal-overlay" id="modal-note-picker" role="dialog" aria-label="Note Picker" hidden>
    <div class="modal-box">
      <h3>Edit Step</h3>
      <div class="note-picker-grid" id="note-picker-grid"></div>
      <div class="step-params">
        <label>Velocity
          <input type="range" id="sp-velocity" min="1" max="127" value="100" />
          <span id="sp-velocity-val">100</span>
        </label>
        <label>Gate
          <select id="sp-gate">
            <option value="0.25">25%</option>
            <option value="0.5" selected>50%</option>
            <option value="0.75">75%</option>
            <option value="1.0">100%</option>
          </select>
        </label>
        <label>Probability
          <input type="range" id="sp-probability" min="0" max="100" value="100" />
          <span id="sp-probability-val">100%</span>
        </label>
      </div>
      <div class="modal-actions">
        <button class="btn-primary" id="sp-confirm">Apply</button>
        <button class="btn-secondary" id="sp-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast" aria-live="polite"></div>

  <!-- ─── SCRIPTS ────────────────────────────────────────── -->
  <script src="js/presets.js"></script>
  <script src="js/sampler.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/midi.js"></script>
  <script src="js/sequencer.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
